spring:
  application:
    name: livic-backend
  main:
    lazy-initialization: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:3307/livic?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:livic}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:livic}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 20000
      leak-detection-threshold: 60000

  profiles:
    default: dev

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        show_sql: false
        type:
          preferred_uuid_jdbc_type: CHAR
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        batch_versioned_data: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: true
    repair-on-migrate: true


server:
  port: ${SERVER_PORT:8080}

management:
  tracing:
    sampling:
      probability: 1.0
  observations:
    key-values:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.livic: DEBUG

app:
  internal:
    auth:
      token: ${APP_INTERNAL_AUTH_TOKEN:}
  jwt:
    # HS256 requires a secret with enough entropy; use at least 32 bytes in production (APP_JWT_SECRET).
    secret: ${APP_JWT_SECRET:dev-only-change-this-to-a-long-random-secret-32b-min}
    access-expiration-ms: ${APP_JWT_ACCESS_EXPIRATION_MS:${APP_JWT_ACCESS_MS:900000}}
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:${APP_JWT_REFRESH_MS:604800000}}
  oauth:
    google:
      enabled: ${GOOGLE_OAUTH_ENABLED:false}
      # Comma-separated web, iOS, and Android client IDs; any of them is accepted as the token audience.
      client-ids: ${GOOGLE_OAUTH_CLIENT_IDS:}
  auth:
    max-failed-login-attempts: ${APP_AUTH_MAX_FAILED_LOGIN_ATTEMPTS:5}
    lockout-duration-ms: ${APP_AUTH_LOCKOUT_DURATION_MS:900000}
  logging:
    correlation-header-name: ${APP_CORRELATION_HEADER_NAME:X-Correlation-Id}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:8081}
    allowed-methods: ${APP_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${APP_CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,Origin,X-Correlation-Id}
    allow-credentials: ${APP_CORS_ALLOW_CREDENTIALS:true}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:mock-key-id}
  key-secret: ${RAZORPAY_KEY_SECRET:mock-key-secret}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:mock-webhook-secret}

email:
  enabled: ${EMAIL_ENABLED:false}
  host: ${EMAIL_HOST:localhost}
  port: ${EMAIL_PORT:587}
  username: ${EMAIL_USERNAME:mock-email-user}
  password: ${EMAIL_PASSWORD:mock-email-pass}
  from-address: ${EMAIL_FROM_ADDRESS:no-reply@livic.com}

whatsapp:
  enabled: ${WHATSAPP_ENABLED:false}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:mock-phone-id}
  access-token: ${WHATSAPP_ACCESS_TOKEN:mock-token}

push:
  enabled: ${PUSH_ENABLED:false}

msg91:
  enabled: ${MSG91_ENABLED:false}
  auth-key: ${MSG91_AUTH_KEY:}
  sender-id: ${MSG91_SENDER_ID:LIVIC}
  sms:
    enabled: ${MSG91_SMS_ENABLED:false}
    flow-id: ${MSG91_SMS_FLOW_ID:}
  whatsapp:
    enabled: ${MSG91_WHATSAPP_ENABLED:false}
    integrated-number: ${MSG91_WHATSAPP_INTEGRATED_NUMBER:}

storage:
  provider: ${STORAGE_PROVIDER:CLOUDINARY}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:demo}
    api-key: ${CLOUDINARY_API_KEY:mock-key}
    api-secret: ${CLOUDINARY_API_SECRET:mock-secret}
    folder-prefix: ${CLOUDINARY_FOLDER_PREFIX:livic}


