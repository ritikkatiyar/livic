server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: livic-ai-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MIN_IDLE:1}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: false

  ai:
    # At most 3 tries with short backoff (docs/AI_ARCHITECTURE_DESIGN.md §30). The default of 10 with
    # 5x backoff held a request for ~45s on a provider 429, past the apps' timeout.
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 4s
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-2.5-flash}
            temperature: ${GEMINI_TEMPERATURE:0.2}

app:
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-change-this-to-a-long-random-secret-32b-min}
    access-expiration-ms: ${APP_JWT_ACCESS_MS:900000}
  ai:
    enabled: ${APP_AI_ENABLED:false}
  backend:
    client:
      base-url: ${BACKEND_BASE_URL:http://localhost:8080}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081}
    allowed-methods: ${APP_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${APP_CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,Origin,X-Correlation-Id}
    allow-credentials: ${APP_CORS_ALLOW_CREDENTIALS:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    export:
      simple:
        enabled: true

logging:
  level:
    root: INFO
    com.livic: DEBUG
