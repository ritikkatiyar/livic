services:
  mysql:
    image: mysql:8.4
    container_name: livic-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-livic}
      MYSQL_USER: ${MYSQL_USER:-livic}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-livic}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3307:3306"
    volumes:
      - livic_mysql_data:/var/lib/mysql
    networks:
      - livic-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: livic-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-livic}?useSSL=false&allowPublicKeyRetrieval=true
      - DB_USERNAME=${MYSQL_USER:-livic}
      - DB_PASSWORD=${MYSQL_PASSWORD:-livic}
      - APP_JWT_SECRET=${APP_JWT_SECRET:-dev-only-change-this-to-a-long-random-secret-32b-min}
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8081}
      - MARKETPLACE_BASE_URL=${MARKETPLACE_BASE_URL:-http://localhost:3000}
      # Messaging: this compose file is for local runs, so channels without MSG91 settings print to the log
      - APP_MESSAGING_CONSOLE_FALLBACK=${APP_MESSAGING_CONSOLE_FALLBACK:-true}
      - MARKETPLACE_OTP_CHANNELS=${MARKETPLACE_OTP_CHANNELS:-SMS}
      - MSG91_SMS_ENABLED=${MSG91_SMS_ENABLED:-false}
      - MSG91_AUTH_KEY=${MSG91_AUTH_KEY:-}
      - MSG91_SMS_FLOW_MARKETPLACE_OTP=${MSG91_SMS_FLOW_MARKETPLACE_OTP:-}
      - MSG91_SMS_FLOW_TOUR_APPROVED=${MSG91_SMS_FLOW_TOUR_APPROVED:-}
      - MSG91_SMS_FLOW_TOUR_DECLINED=${MSG91_SMS_FLOW_TOUR_DECLINED:-}
      - MSG91_SMS_FLOW_TOUR_REMINDER=${MSG91_SMS_FLOW_TOUR_REMINDER:-}
      - MSG91_WHATSAPP_ENABLED=${MSG91_WHATSAPP_ENABLED:-false}
      - MSG91_WHATSAPP_INTEGRATED_NUMBER=${MSG91_WHATSAPP_INTEGRATED_NUMBER:-}
      - MSG91_WHATSAPP_TEMPLATE_MARKETPLACE_OTP=${MSG91_WHATSAPP_TEMPLATE_MARKETPLACE_OTP:-}
      - MSG91_WHATSAPP_TEMPLATE_TOUR_APPROVED=${MSG91_WHATSAPP_TEMPLATE_TOUR_APPROVED:-}
      - MSG91_WHATSAPP_TEMPLATE_TOUR_DECLINED=${MSG91_WHATSAPP_TEMPLATE_TOUR_DECLINED:-}
      - MSG91_WHATSAPP_TEMPLATE_TOUR_REMINDER=${MSG91_WHATSAPP_TEMPLATE_TOUR_REMINDER:-}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - livic-network

networks:
  livic-network:
    driver: bridge

volumes:
  livic_mysql_data:
