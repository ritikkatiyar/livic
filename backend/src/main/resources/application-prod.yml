spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
  flyway:
    enabled: true
    url: ${DB_URL}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    baseline-on-migrate: false
    validate-on-migrate: true

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

msg91:
  sms:
    required: ${MSG91_SMS_REQUIRED:true}

server:
  # Client IPs from X-Forwarded-For, trusted only from proxies on private networks (per-IP OTP limit)
  forward-headers-strategy: native
  tomcat:
    threads:
      max: 20
    max-connections: 50

logging:
  level:
    com.livic: INFO
    org.springframework.security: WARN

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    access-expiration-ms: ${APP_JWT_ACCESS_MS:900000}
    refresh-expiration-ms: ${APP_JWT_REFRESH_MS:604800000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
    allow-credentials: ${APP_CORS_ALLOW_CREDENTIALS:true}
